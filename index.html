<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF=8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チュウニズムスコア管理ツール</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- トークン入力画面 -->
    <div id="token-screen">
        <h1>チュウニズムスコア管理ツール</h1>
        <p>
            chunirecのアクセストークンを入力してください。<br>
            トークンは <a href="https://developer.chunirec.net/" target="_blank">developer.chunirec.net</a> から取得できます。<br>
            <small style="color:#666;">トークンはこのサイトには保存されません。</small>
        </p>

        <div class="input-wrapper">
            <input type="password" id="token-input" placeholder="chunirecトークンを入力">
            <button id="toggle-token" type="button" onclick="toggleTokenVisibility()">👁️</button>
        </div>

        <div class="button-area">
            <button id="load-btn" onclick="loadScores()">スコアを表示</button>
        </div>

        <div id="loading-msg">データを同期中...（十秒程度かかります）</div>
        <p id="token-error">トークンが正しくありません。もう一度確認してください。</p>
    </div>

    <!-- スコア表示画面 -->
    <div id="main-screen" style="display: none;">

        <h1>ウニスコア管理ツール</h1>

        <div class="button-group">
            <button onclick="refreshScores()" class="nav-item active refresh-btn">データを再同期</button>
            <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>

        <div class="rating-wrapper">
            <div id="rating-average" class="rating-display-box">
            </div>
        </div>


        <div class="search-container">
            <div class="filter-controls">

                <div class="filter-layout-container"> <button id="clear-filter"
                        class="btn-reset vertical-reset">リセット</button>


                    <div class="filter-rows-group">

                        <div class="filter-row">
                            <input type="text" id="search-input" placeholder="曲名で検索...">

                            <div class="filter-group">
                                <label class="filter-label">単レ</label>
                                <input type="number" id="min-rating" class="filter-select" step="0.01" placeholder="下限"
                                    style="width: 50px;">
                                <span class="range-separator">〜</span>
                                <input type="number" id="max-rating" class="filter-select" step="0.01" placeholder="上限"
                                    style="width: 50px;">
                            </div>
                        </div>

                        <div class="filter-row">
                            <div class="filter-group">

                                <label for="lamp-filter" class="filter-label">ランプ</label>
                                <select id="lamp-filter" class="filter-select">
                                    <option value="all">すべて</option>
                                    <option value="ajc">AJC</option>
                                    <option value="aj">AJ</option>
                                    <option value="None">未AJ</option>
                                </select>


                                <label class="filter-label">Rank</label>
                                <div class="rank-filter-container" style="display: flex; align-items: center;">
                                    <select id="rank-min" class="filter-select" style="width: 95px;">
                                        <option value="1009900">99AJ</option>
                                        <option value="1009000">SSS+</option>
                                        <option value="1007500">SSS</option>
                                        <option value="1007000">7000</option>
                                        <option value="1005000">SS+</option>
                                        <option value="1000000">SS</option>
                                        <option value="990000">S+</option>
                                        <option value="970000">S</option>
                                        <option value="0" selected>0</option>
                                    </select>
                                    <span style="font-size: 12px;">～</span>
                                    <select id="rank-max" class="filter-select" style="width: 95px;">
                                        <option value="1010000" selected>理論値</option>
                                        <option value="1009900">99AJ</option>
                                        <option value="1009000">SSS+</option>
                                        <option value="1007500">SSS</option>
                                        <option value="1007000">7000</option>
                                        <option value="1005000">SS+</option>
                                        <option value="1000000">SS</option>
                                        <option value="990000">S+</option>
                                        <option value="970000">S</option>
                                    </select>
                                </div>


                                <label for="min-constant" class="filter-label">定数</label>
                                <select id="min-constant" class="filter-select"></select>
                                <span class="range-separator">〜</span>
                                <select id="max-constant" class="filter-select"></select>
                            </div>
                        </div>

                        <div class="filter-row">
                            <div class="filter-group">
                                <span class="filter-label">ソート:</span>
                                <button id="sort-Rating" class="btn-sort active">Rating順</button>
                                <button id="sort-score" class="btn-sort">スコア順</button>
                            </div>
                            <div class="filter-group" style="margin-left: 5px;">
                                <span class="filter-label">対象:</span>
                                <button id="filter-all" class="btn-filter filter-btn-unit active"
                                    data-value="all">全曲</button>
                                <button id="filter-old" class="btn-filter filter-btn-unit" data-value="old">旧曲</button>
                                <button id="filter-new" class="btn-filter filter-btn-unit" data-value="new">新曲</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="stats-exec-area" style="margin: 15px 0;">
                <button id="stats-player-btn" class="btn-stats" onclick="fetchStats('player')"
                    style="background-color: #4a90e2;">統計 (個人別)</button>
                <button id="stats-song-btn" class="btn-stats" onclick="fetchStats('song')"
                    style="background-color: #f5a623;">統計 (楽曲別)</button>
                <button id="random-btn" class="btn-random" onclick="pickRandomSong()">課題曲を選出</button>
            </div>

            <div id="loading">データを取得中...</div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40px;">#</th>
                            <th style="width: 55%; text-align: left;">楽曲情報</th>
                            <th style="width: 12.5%; text-align: center;">ランプ</th>
                            <th style="width: 22.5%; text-align: center;">スコア</th>
                            <th style="width: 20%; text-align: center;">単曲レート</th>
                        </tr>
                    </thead>

                    <tbody id="score-body"></tbody>
                </table>
            </div>


            <div id="ranking-modal" style="display: none;">
                <div class="modal-content">

                    <h3 id="ranking-title-container"></h3>

                    <div id="stats-control-area" style="text-align: center; margin-bottom: 5px;"></div>

                    <div id="ranking-controls">
                        <div style="text-align: left; margin-bottom: 2px;">
                            <button id="reset-visibility-btn" onclick="resetTableVisibility()"
                                class="reset-btn">全て再表示（行をクリックすると非表示になります）</button>
                        </div>

                        <div class="range-selector">
                            <button class="range-btn active" data-min="1000000"
                                onclick="updateRankingRange(1000000)">SS～</button>
                            <button class="range-btn" data-min="1005000"
                                onclick="updateRankingRange(1005000)">SS+～</button>
                            <button class="range-btn" data-min="1007500"
                                onclick="updateRankingRange(1007500)">SSS～</button>
                            <button class="range-btn" data-min="1009000"
                                onclick="updateRankingRange(1009000)">SSS+～</button>
                        </div>

                        <canvas id="ranking-canvas" width="800" height="180"></canvas>
                    </div>

                    <div style="margin-top: 15px; width: 100%;">
                        <table id="ranking-table" style="width:100%">
                            <thead id="ranking-thead">
                                <tr>
                                    <th>順位</th>
                                    <th>名前</th>
                                    <th>スコア</th>
                                    <th>詳細</th>
                                </tr>
                            </thead>
                            <tbody id="ranking-body"></tbody>
                        </table>
                    </div>

                    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                        <button id="discord-share-btn" onclick="shareToDiscord()">Discordに送信</button>
                        <button class="modal-close-btn"
                            onclick="document.getElementById('ranking-modal').style.display='none'">閉じる</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sub-modal" class="modal" style="display:none; z-index:2000;">
        <div class="modal-content sub-modal-content">
            <h3 id="sub-modal-title">達成者一覧</h3>
            <div class="sub-modal-body">
                <table id="sub-modal-table">
                    <thead>
                        <tr>
                            <th>プレイヤー</th>
                            <th>スコア</th>
                        </tr>
                    </thead>
                    <tbody id="sub-modal-tbody"></tbody>
                </table>
            </div>
            <button onclick="closeSubModal()" class="sub-modal-close-btn">閉じる</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
